# Arma, prueba y empaqueta Fábrica Studio en un Windows real.
# Resultado: el instalador FabricaStudio-Setup-<versión>.exe como artefacto descargable (7 días).
name: Windows (pruebas, .exe e instalador)

on:
  workflow_dispatch:
  push:
    branches: [claude/fabrica-studio-shorts-x34of8]
    paths: ["fabrica_studio/**", "empaquetado/**", "requirements*.txt", "tests/**", ".github/workflows/windows.yml"]

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt pyinstaller

      - name: FFmpeg (gyan.dev, compilación «essentials», con libass y libx264)
        run: |
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $bin = (Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1).Directory
          New-Item -ItemType Directory -Force ffmpeg | Out-Null
          Copy-Item "$($bin.FullName)\ffmpeg.exe","$($bin.FullName)\ffprobe.exe" ffmpeg\
          Copy-Item (Get-ChildItem ffmpeg_tmp -Recurse -Filter LICENSE* | Select-Object -First 1).FullName ffmpeg\LICENSE.txt
          "$PWD\ffmpeg" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          .\ffmpeg\ffmpeg.exe -version | Select-Object -First 1

      - name: Pruebas en Windows (pytest)
        run: python -m pytest -q

      - name: Armar el programa (PyInstaller)
        run: |
          pyinstaller empaquetado/FabricaStudio.spec --noconfirm
          New-Item -ItemType Directory -Force dist\FabricaStudio\ffmpeg | Out-Null
          Copy-Item ffmpeg\* dist\FabricaStudio\ffmpeg\
          "{0:N0} MB" -f ((Get-ChildItem dist\FabricaStudio -Recurse | Measure-Object Length -Sum).Sum / 1MB)

      - name: Probar el programa armado
        env:
          FABRICA_DATOS: ${{ runner.temp }}\datos_prueba
          FABRICA_PUERTO: "8797"
        run: |
          $exe = "dist\FabricaStudio\FabricaStudio.exe"
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "--version falló" }
          # Sin FFmpeg en el PATH: el diagnóstico debe usar la copia incluida y renderizar.
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notlike "*\ffmpeg" }) -join ';'
          & $exe --diagnostico
          if ($LASTEXITCODE -ne 0) { throw "El diagnóstico encontró fallos" }
          $p = Start-Process $exe -ArgumentList "--sin-navegador" -PassThru
          $ok = $false
          foreach ($i in 1..60) {
            try { $r = Invoke-RestMethod http://127.0.0.1:8797/api/sesion -TimeoutSec 2; if ($r.version) { $ok = $true; break } } catch {}
            Start-Sleep 1
          }
          $panel = (Invoke-WebRequest http://127.0.0.1:8797/ -UseBasicParsing).StatusCode
          Stop-Process -Id $p.Id -Force
          if (-not $ok -or $panel -ne 200) { throw "El panel no respondió" }
          "Panel OK (versión $($r.version))"

      - name: Instalador (Inno Setup)
        run: |
          $version = (Select-String -Path fabrica_studio\__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          "VERSION=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DVersion=$version" empaquetado\instalador.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup falló" }
          Get-ChildItem salida

      - name: Probar el instalador (instalación silenciosa)
        run: |
          $setup = (Get-ChildItem salida\FabricaStudio-Setup-*.exe).FullName
          Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/TASKS=" -Wait
          $instalado = "$env:LOCALAPPDATA\Programs\FabricaStudio\FabricaStudio.exe"
          if (-not (Test-Path $instalado)) { throw "No quedó instalado en $instalado" }
          & $instalado --version
          if ($LASTEXITCODE -ne 0) { throw "El programa instalado no arranca" }

      - uses: actions/upload-artifact@v4
        with:
          name: FabricaStudio-Setup-${{ env.VERSION }}
          path: salida/FabricaStudio-Setup-*.exe
          retention-days: 7
          if-no-files-found: error
