<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0c0c0d">
<title>Fábrica Studio</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<div id="vincular" class="vincular" hidden>
  <form class="tarjeta" id="form-vincular">
    <h1>Fábrica Studio</h1>
    <p class="tenue">Este dispositivo aún no está vinculado. En el PC abre <b>Ajustes → Dispositivos</b>, pulsa «Generar código» y escríbelo aquí.</p>
    <label>Código de 6 dígitos<input id="v-codigo" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required></label>
    <label>Nombre de este dispositivo<input id="v-nombre" value="Tablet" maxlength="40"></label>
    <button class="primario">Vincular</button>
    <p class="error" id="v-error" role="alert"></p>
  </form>
</div>

<div id="app" class="app" hidden>
  <aside class="lateral" id="lateral" aria-label="Navegación principal">
    <div class="marca"><i class="marca-signo" aria-hidden="true"></i><span class="marca-texto">Fábrica <small>Studio</small></span></div>
    <div class="espacio" id="espacio"></div>
    <nav class="nav" aria-label="Secciones">
      <a href="#resumen" data-vista="resumen" data-tip="Resumen"><i data-icono="rejilla"></i><span class="nav-texto">Resumen</span></a>
      <a href="#cola" data-vista="cola" data-tip="Cola de clips"><i data-icono="capas"></i><span class="nav-texto">Cola de clips</span><span class="cuenta" id="nav-cuenta" hidden></span></a>
      <a href="#biblioteca" data-vista="biblioteca" data-tip="Biblioteca"><i data-icono="pelicula"></i><span class="nav-texto">Biblioteca</span></a>
      <a href="#ajustes" data-vista="ajustes" data-tip="Ajustes"><i data-icono="ajustes"></i><span class="nav-texto">Ajustes</span></a>
    </nav>
    <div class="lateral-pie">
      <div class="tarjeta-pc" id="tarjeta-pc"></div>
      <div class="perfil" id="perfil"></div>
    </div>
  </aside>
  <div class="velo" id="velo"></div>
  <div class="cuerpo">
    <header class="barra">
      <button class="icono-boton" id="boton-menu" aria-label="Barra lateral" title="Plegar o desplegar la barra lateral (Ctrl+B)" aria-expanded="true" aria-controls="lateral"><i data-icono="panel"></i></button>
      <div class="miga"><span>Estudio</span><span aria-hidden="true">/</span><span id="miga"></span></div>
      <label class="buscar"><i data-icono="buscar"></i><span class="solo-lector">Buscar un clip</span><input id="buscar" type="search" placeholder="Buscar un clip…" autocomplete="off"><kbd>Ctrl K</kbd></label>
    </header>
    <main id="principal" class="principal"></main>
  </div>
</div>

<div class="modal-fondo" id="modal-fondo" hidden>
  <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
    <header class="modal-cabeza"><h2 id="modal-titulo"></h2><button class="icono-boton" data-accion="cerrar-modal" aria-label="Cerrar ventana"><i data-icono="cerrar"></i></button></header>
    <div class="modal-cuerpo" id="modal-cuerpo"></div>
    <footer class="modal-pie" id="modal-pie"></footer>
  </section>
</div>
<div id="avisos" class="avisos" role="status" aria-live="polite"></div>
<script src="iconos.js"></script>
<script src="app.js"></script>
</body>
</html>
