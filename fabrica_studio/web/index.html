<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f11">
<title>Fábrica Studio</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<div id="vincular" class="vincular" hidden>
  <form class="tarjeta" id="form-vincular">
    <h1>Fábrica Studio</h1>
    <p class="tenue">Este dispositivo aún no está vinculado. En el PC abre <b>Ajustes → Dispositivos</b>, pulsa «Generar código» y escríbelo aquí.</p>
    <label>Código de 6 dígitos<input id="v-codigo" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required></label>
    <label>Nombre de este dispositivo<input id="v-nombre" value="Tablet" maxlength="40"></label>
    <button class="primario">Vincular</button>
    <p class="error" id="v-error" role="alert"></p>
  </form>
</div>

<div id="app" class="app" hidden>
  <nav class="lateral" aria-label="Secciones">
    <div class="marca">Fábrica<span>Studio</span></div>
    <a href="#cola" data-vista="cola">Cola</a>
    <a href="#biblioteca" data-vista="biblioteca">Biblioteca</a>
    <a href="#ajustes" data-vista="ajustes">Ajustes</a>
    <div class="pie" id="pie-canal"></div>
  </nav>
  <main id="principal"></main>
</div>
<div id="avisos" class="avisos" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
